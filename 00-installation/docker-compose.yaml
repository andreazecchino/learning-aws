name: learning-aws

services:
  floci:
    image: floci/floci:2.5.0
    container_name: floci
    restart: unless-stopped
    ports:
      - "4566:4566"
    volumes:
      - floci-data:/app/data
    environment:
      FLOCI_HOSTNAME: floci
    networks:
      - floci

volumes:
  floci-data:
    name: floci-data

networks:
  floci:
    name: floci-network
