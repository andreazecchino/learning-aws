name: learning-aws

services:
  floci:
    image: floci/floci:2.5.0
    container_name: floci
    restart: unless-stopped
    ports:
      - "4566:4566"
    volumes:
      - floci-data:/app/data
    environment:
      FLOCI_HOSTNAME: floci
    networks:
      - floci

  aws-cli:
    image: amazon/aws-cli:2.42.1
    container_name: aws-cli
    restart: unless-stopped
    stdin_open: true
    tty: true
    environment:
      AWS_ENDPOINT_URL: http://floci:4566
      AWS_DEFAULT_REGION: eu-south-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    networks:
      - floci

volumes:
  floci-data:
    name: floci-data

networks:
  floci:
    name: floci-network
